<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon espace | SWIPEUPCAR</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="nav"></div>
<div class="container" style="padding:22px 20px;display:grid;grid-template-columns:230px 1fr;gap:24px" class="dash-grid">
  <aside class="sidebar card hide-mobile" style="padding:14px;height:fit-content;position:sticky;top:80px">
    <a data-t="dash" class="active"><i class="fa-solid fa-gauge"></i> Tableau de bord</a>
    <a data-t="book"><i class="fa-solid fa-calendar-check"></i> Mes réservations</a>
    <a data-t="rdv"><i class="fa-regular fa-calendar-check"></i> Mes rendez-vous</a>
    <a data-t="fav" id="fav"><i class="fa-regular fa-heart"></i> Mes favoris</a>
    <a href="messages.html"><i class="fa-regular fa-comment"></i> Mes messages</a>
    <a data-t="reviews"><i class="fa-regular fa-star"></i> Mes avis</a>
    <a data-t="profile"><i class="fa-regular fa-user"></i> Mon profil</a>
  </aside>
  <main id="main"></main>
</div>
<div id="footer"></div><div id="mnav"></div>
<script src="assets/app.js"></script>
<script>
const u=requireAuth('PARTICULIER');
if(u){
 const tabs=[...document.querySelectorAll('.sidebar a[data-t]')];
 tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');render(t.dataset.t)});
 function myBookings(){return DB.get().bookings.filter(b=>b.userId===u.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))}
 function statusChip(s){const m={confirmed:['#E8F5E9','var(--green)','Confirmée'],pending:['#FFF3E0','var(--amber)','En attente'],cancelled:['#FDEAEA','var(--red)','Annulée'],completed:['#eef','#556','Terminée']};const[bg,c,l]=m[s]||m.confirmed;return `<span class="chip" style="background:${bg};color:${c};border:none">${l}</span>`}
 function render(t){
  const db=DB.get();const M=document.getElementById('main');
  if(t==='dash'){
    const bk=myBookings();const up=bk.filter(b=>b.to>=todayISO());
    M.innerHTML=`<h1 style="font-size:26px">Bonjour ${u.firstName} 👋</h1>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px">
     <div class="stat"><div class="num">${up.length}</div><div style="color:var(--muted)">Réservations à venir</div></div>
     <div class="stat"><div class="num">${bk.length}</div><div style="color:var(--muted)">Total réservations</div></div>
     <div class="stat"><div class="num">${(db.favorites[u.id]||[]).length}</div><div style="color:var(--muted)">Favoris</div></div>
     <div class="stat"><div class="num">${money(bk.reduce((s,b)=>s+b.total,0))}</div><div style="color:var(--muted)">Dépensé</div></div>
    </div>
    <h2 style="font-size:20px;margin-top:26px">Prochaines réservations</h2>${bk.length?bookList(up.length?up:bk.slice(0,2)):empty('Aucune réservation','Trouvez le véhicule idéal.','location.html','Rechercher un véhicule')}`;
  } else if(t==='book'){
    const bk=myBookings();M.innerHTML=`<h1 style="font-size:26px">Mes réservations</h1>${bk.length?bookList(bk):empty('Aucune réservation','Vos réservations apparaîtront ici.','location.html','Rechercher')}`;
  } else if(t==='fav'){
    const favs=(db.favorites[u.id]||[]).map(id=>db.vehicles.find(v=>v.id===id)).filter(Boolean);
    M.innerHTML=`<h1 style="font-size:26px">Mes favoris</h1>${favs.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:16px">${favs.map(vehicleCard).join('')}</div>`:empty('Aucun favori','Ajoutez des véhicules à vos favoris avec le ♥.','location.html','Explorer')}`;
  } else if(t==='reviews'){
    const done=myBookings().filter(b=>b.to<todayISO());const revs=db.reviews.filter(r=>r.userId===u.id);
    M.innerHTML=`<h1 style="font-size:26px">Mes avis</h1><p style="color:var(--muted)">Notez vos locations passées.</p>${done.length?done.map(b=>{const v=db.vehicles.find(x=>x.id===b.vehicleId);const has=revs.find(r=>r.bookingId===b.id);return `<div class="card" style="padding:16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b>${v.brand} ${v.model}</b><div style="color:var(--muted);font-size:13px">${b.ref}</div></div>${has?`<span>${'★'.repeat(has.rating)}</span>`:`<button class="btn btn-red" onclick="leaveReview('${b.id}','${v.id}')">Laisser un avis</button>`}</div>`}).join(''):empty('Aucune location terminée','Vos avis seront possibles après vos locations.','location.html','Réserver')}`;
  } else if(t==='rdv'){
    const rdvs=apiSync('/appointments/mine');const arr=Array.isArray(rdvs)?rdvs:[];
    M.innerHTML=`<h1 style="font-size:26px">Mes rendez-vous</h1>${arr.length?`<div style="margin-top:14px;display:grid;gap:10px">${arr.map(r=>`<div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><b>${r.serviceName}</b><div style="color:var(--muted);font-size:13px">${r.providerName} • ${new Date(r.date).toLocaleDateString('fr-FR')} à ${r.time} • ${r.ref}</div></div><span class="chip" style="background:#E8F5E9;color:var(--green);border:none">${r.status}</span></div>`).join('')}</div>`:empty('Aucun rendez-vous','Prenez RDV pour l\'entretien, les pneus ou le lavage.','services.html?s=entretien','Prendre RDV')}`;
  } else if(t==='profile'){
    M.innerHTML=`<h1 style="font-size:26px">Mon profil</h1><div class="card" style="padding:22px;margin-top:14px;max-width:480px">
     <label class="label">Prénom</label><input class="input" id="pf" value="${u.firstName}">
     <label class="label" style="margin-top:12px">Nom</label><input class="input" id="pl" value="${u.lastName||''}">
     <label class="label" style="margin-top:12px">Email</label><input class="input" value="${u.email}" disabled>
     <label class="label" style="margin-top:12px">Téléphone</label><input class="input" id="pp" value="${u.phone||''}">
     <button class="btn btn-red" style="margin-top:16px" onclick="saveProfile()">Enregistrer</button>
    </div>`;
  }
 }
 function bookList(bk){return `<div style="margin-top:14px;display:grid;gap:12px">${bk.map(b=>{const v=DB.get().vehicles.find(x=>x.id===b.vehicleId);return `<div class="card" style="padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><img src="${v.images[0]}" style="width:110px;height:74px;object-fit:cover;border-radius:10px"><div style="flex:1;min-width:160px"><b>${v.brand} ${v.model}</b><div style="color:var(--muted);font-size:13px">${new Date(b.from).toLocaleDateString('fr-FR')} → ${new Date(b.to).toLocaleDateString('fr-FR')} • ${b.ref}</div><div style="margin-top:6px">${statusChip(b.status)}</div></div><div style="text-align:right"><div style="font-weight:800">${money(b.total)}</div><a href="messages.html?to=${b.ownerId}&v=${v.id}" class="btn btn-ghost" style="padding:6px 12px;font-size:13px;margin-top:6px">Contacter</a></div></div>`}).join('')}</div>`}
 function empty(t,d,link,cta){return `<div class="card" style="padding:50px 20px;text-align:center;margin-top:16px"><i class="fa-solid fa-inbox" style="font-size:38px;color:var(--muted)"></i><h3 style="margin:14px 0 6px">${t}</h3><p style="color:var(--muted)">${d}</p><a href="${link}" class="btn btn-red" style="margin-top:12px">${cta}</a></div>`}
 window.saveProfile=()=>{const db=DB.get();const usr=db.users.find(x=>x.id===u.id);usr.firstName=pf.value;usr.lastName=pl.value;usr.phone=pp.value;DB.set(db);toast('Profil enregistré');renderNav()};
 window.leaveReview=(bid,vid)=>{const r=prompt('Note de 1 à 5 :','5');const n=Math.max(1,Math.min(5,+r||5));const db=DB.get();db.reviews.push({id:uid('R'),bookingId:bid,vehicleId:vid,userId:u.id,rating:n,text:'Très bonne expérience',date:new Date().toISOString()});DB.set(db);toast('Merci pour votre avis !');render('reviews')};
 const _h=(location.hash||'').replace('#','');
 if(_h==='rdv'){document.querySelector('[data-t=rdv]').click();}
 else if(_h==='fav'){document.querySelector('[data-t=fav]').click();}
 else render('dash');
}
</script>
<style>@media(max-width:860px){.dash-grid{grid-template-columns:1fr!important}}</style>
</body></html>
