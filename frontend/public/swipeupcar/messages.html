<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messagerie | SWIPEUPCAR</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="nav"></div>
<div class="container" style="padding:22px 20px" id="page"></div>
<div id="footer"></div><div id="mnav"></div>
<script src="assets/app.js"></script>
<script>
const u=requireAuth();
if(u){
 const P=new URLSearchParams(location.search);const to=P.get('to');
 function convId(a,b){return[a,b].sort().join('_')}
 function getConv(id){const db=DB.get();return db.conversations.find(c=>c.id===id)}
 function ensureConv(other){const db=DB.get();const id=convId(u.id,other);let c=db.conversations.find(x=>x.id===id);if(!c){c={id,members:[u.id,other],messages:[]};db.conversations.push(c);DB.set(db)}return id}
 if(to)ensureConv(to);
 function myConvs(){return DB.get().conversations.filter(c=>c.members.includes(u.id))}
 let active=to?convId(u.id,to):(myConvs()[0]&&myConvs()[0].id);
 function render(){
  const db=DB.get();const convs=myConvs();
  const list=convs.map(c=>{const other=db.users.find(x=>x.id===c.members.find(m=>m!==u.id));const last=c.messages[c.messages.length-1];return `<div onclick="setActive('${c.id}')" class="card" style="padding:12px;margin-bottom:8px;cursor:pointer;${c.id===active?'border-color:var(--red)':''}"><b>${other?(other.company||other.firstName):'Utilisateur'}</b><div style="color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?last.text:'Nouvelle conversation'}</div></div>`}).join('')||'<p style="color:var(--muted)">Aucune conversation.</p>';
  const c=convs.find(x=>x.id===active);
  let thread='<div style="display:grid;place-items:center;height:300px;color:var(--muted)">Sélectionnez une conversation</div>';
  if(c){const other=db.users.find(x=>x.id===c.members.find(m=>m!==u.id));
   thread=`<div style="padding:14px;border-bottom:1px solid var(--line);font-weight:700">${other?(other.company||other.firstName):'Utilisateur'} ${other&&other.verified?'<span class="chip badge-verified" style="font-size:11px">Vérifié</span>':''}</div>
   <div id="msgs" style="padding:14px;height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">${c.messages.map(m=>`<div style="align-self:${m.from===u.id?'flex-end':'flex-start'};max-width:75%;padding:10px 14px;border-radius:14px;background:${m.from===u.id?'var(--red)':'#fff'};color:${m.from===u.id?'#fff':'inherit'};border:1px solid var(--line)">${m.text}${m.warn?'<div style="font-size:11px;opacity:.8;margin-top:4px">⚠ coordonnées masquées</div>':''}</div>`).join('')||'<div style="color:var(--muted);text-align:center;margin:auto">Démarrez la conversation</div>'}</div>
   <form id="sendForm" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)"><input class="input" id="msgInput" placeholder="Votre message..." data-testid="msg-input"><button class="btn btn-red" data-testid="msg-send">Envoyer</button></form>
   <div style="padding:0 14px 12px;color:var(--muted);font-size:12px"><i class="fa-solid fa-lock"></i> Pour votre sécurité, les coordonnées externes ne peuvent pas être partagées avant la réservation.</div>`;}
  document.getElementById('page').innerHTML=`<h1 style="font-size:24px">Messagerie</h1><div style="display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:14px" class="msg-grid"><div>${list}</div><div class="card" style="min-height:420px;display:flex;flex-direction:column">${thread}</div></div>`;
  const sf=document.getElementById('sendForm');if(sf)sf.onsubmit=e=>{e.preventDefault();send(document.getElementById('msgInput').value)};
  const box=document.getElementById('msgs');if(box)box.scrollTop=box.scrollHeight;
 }
 window.setActive=id=>{active=id;render()};
 function send(text){text=text.trim();if(!text)return;const warn=containsContact(text);if(warn){text=text.replace(CONTACT_RE,'•••••');toast('Coordonnées masquées pour votre sécurité');}
  const db=DB.get();const c=db.conversations.find(x=>x.id===active);c.messages.push({from:u.id,text,warn,date:new Date().toISOString()});DB.set(db);render();}
 render();
}
</script>
<style>@media(max-width:860px){.msg-grid{grid-template-columns:1fr!important}}</style>
</body></html>
