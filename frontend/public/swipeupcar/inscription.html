<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription | SWIPEUPCAR</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="nav"></div>
<div class="container" style="padding:40px 20px;max-width:480px">
  <div class="card" style="padding:30px">
    <h1 style="font-size:26px;margin:0 0 4px">Créer un compte</h1>
    <p style="color:var(--muted);margin-top:0">Rejoignez SWIPEUPCAR en 1 minute.</p>
    <form id="regForm" style="margin-top:16px">
      <div style="display:flex;gap:12px"><div style="flex:1"><label class="label">Prénom</label><input class="input" name="firstName" required data-testid="reg-firstname"></div><div style="flex:1"><label class="label">Nom</label><input class="input" name="lastName" required data-testid="reg-lastname"></div></div>
      <label class="label" style="margin-top:12px">Email</label><input class="input" type="email" name="email" required data-testid="reg-email">
      <label class="label" style="margin-top:12px">Téléphone</label><input class="input" name="phone" required data-testid="reg-phone">
      <label class="label" style="margin-top:12px">Mot de passe</label><input class="input" type="password" name="password" minlength="6" required data-testid="reg-password">
      <div id="err" style="color:var(--red);font-size:14px;margin-top:10px;display:none"></div>
      <label style="display:flex;gap:8px;align-items:start;margin-top:14px;font-size:13px;color:var(--muted)"><input type="checkbox" required style="margin-top:3px"> J'accepte les <a href="infos.html#cgu" style="color:var(--red)">conditions générales</a> et la politique de confidentialité.</label>
      <button class="btn btn-red" style="width:100%;margin-top:18px" data-testid="reg-submit">Créer mon compte</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:14px">Déjà inscrit ? <a href="connexion.html" style="color:var(--red);font-weight:700">Se connecter</a></p>
    <p style="text-align:center;margin-top:6px;font-size:13px;color:var(--muted)">Professionnel ? <a href="devenir-loueur.html" style="font-weight:700">Devenir loueur</a></p>
  </div>
</div>
<div id="footer"></div>
<script src="assets/app.js"></script>
<script>
document.getElementById('regForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.role='PARTICULIER';const r=register(f);
 if(r.err){const el=document.getElementById('err');el.style.display='block';el.textContent=r.err;return}
 notify(r.user.id,'Bienvenue sur SWIPEUPCAR ! Vérifiez votre email pour confirmer votre compte.');
 toast('Compte créé ! Bienvenue '+r.user.firstName);
 const next=new URLSearchParams(location.search).get('next');
 setTimeout(()=>location.href=next||'compte.html',700);
};
</script></body></html>
