<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paiement en cours | SWIPEUPCAR</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="nav"></div>
<div class="container" style="padding:60px 20px;max-width:520px;text-align:center" id="page">
  <i class="fa-solid fa-spinner fa-spin" style="font-size:40px;color:var(--red)"></i>
  <h1 style="font-size:24px;margin-top:16px">Validation du paiement…</h1>
  <p style="color:var(--muted)">Merci de patienter, nous confirmons votre réservation.</p>
</div>
<div id="footer"></div>
<script src="assets/app.js"></script>
<script>
const sid=new URLSearchParams(location.search).get('session_id');
let tries=0;
function poll(){
  tries++;
  const r=apiSync('/payments/status/'+sid);
  if(r&&r.payment_status==='paid'&&r.booking_ref){location.href='confirmation.html?ref='+r.booking_ref;return;}
  if(tries>20){document.getElementById('page').innerHTML='<h1 style="font-size:24px">Paiement en cours de traitement</h1><p style="color:var(--muted)">Votre paiement est en cours. Retrouvez votre réservation dans votre espace.</p><a href="compte.html" class="btn btn-red">Mon espace</a>';return;}
  setTimeout(poll,1500);
}
poll();
</script></body></html>
